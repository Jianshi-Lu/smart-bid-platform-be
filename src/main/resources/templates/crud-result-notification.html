<!--
  通用 CRUD 操作结果通知邮件模板（Thymeleaf）

  使用方：io.gitee.lujianshi.bidwinningbackend.aspect.CrudResultEmailAspect
  模板渲染入口：SpringTemplateEngine.process("crud-result", context)

  模板变量（由 CrudResultEmailAspect 通过 Thymeleaf Context 注入）：
    subject         邮件主题
    endpoint        接口路径（含 HTTP method + 类名#方法名）
    operation       操作类型（CREATE / UPDATE / DELETE / BATCH_DELETE / QUERY）
    timestamp       邮件渲染时间（yyyy-MM-dd HH:mm:ss）
    resultCode      Result.code（业务码，如 200/400/404）
    resultMessage   Result.message（消息）
    resultDataJson  Result.data 的 fastjson2 JSON 字符串

  样式说明：
    .op-CREATE        绿色背景 → 新建操作
    .op-UPDATE        蓝色背景 → 更新操作
    .op-DELETE        红色背景 → 删除操作
    .op-BATCH_DELETE  深红背景 → 批量删除
-->
<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">业务操作通知</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; padding: 20px; color: #333; }
        .header { background: #2c3e50; color: #fff; padding: 16px 20px; border-radius: 4px; }
        .header h1 { margin: 0; font-size: 20px; }
        .meta { color: #7f8c8d; font-size: 13px; margin: 16px 0 8px; }
        .meta span { margin-right: 20px; }
        .operation { display: inline-block; padding: 3px 10px; border-radius: 3px; font-size: 12px; font-weight: 600; }
        .op-CREATE        { background: #27ae60; color: #fff; }
        .op-UPDATE        { background: #3498db; color: #fff; }
        .op-DELETE        { background: #e74c3c; color: #fff; }
        .op-BATCH_DELETE  { background: #c0392b; color: #fff; }
        .result-card { background: #f8f9fa; border: 1px solid #e1e4e8; border-radius: 4px; padding: 16px; margin: 12px 0; }
        .result-card .row { display: flex; padding: 4px 0; font-size: 14px; }
        .result-card .label { color: #7f8c8d; width: 100px; flex-shrink: 0; }
        .result-card .value { color: #2c3e50; font-weight: 500; }
        pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px;
              padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
        .footer { color: #95a5a6; font-size: 12px; margin-top: 24px; padding-top: 12px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${subject}">业务操作通知</h1>
    </div>

    <div class="meta">
        <span><strong>接口:</strong> <code th:text="${endpoint}">/api/xxx</code></span>
        <span><strong>时间:</strong> <span th:text="${timestamp}">2026-01-01 12:00:00</span></span>
    </div>

    <p>
        操作类型:
        <span class="operation"
              th:classappend="'op-' + ${operation}"
              th:text="${operation}">CREATE</span>
    </p>

    <div class="result-card">
        <div class="row">
            <span class="label">业务码 (code):</span>
            <span class="value" th:text="${resultCode}">200</span>
        </div>
        <div class="row">
            <span class="label">消息 (message):</span>
            <span class="value" th:text="${resultMessage}">操作成功</span>
        </div>
    </div>

    <p><strong>返回数据 (data):</strong></p>
    <pre th:text="${resultDataJson}">{}</pre>

    <div class="footer">
        本邮件由 bid-winning-backend 系统自动发送，请勿直接回复。
    </div>
</body>
</html>
