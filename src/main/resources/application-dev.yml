server:
  address: 0.0.0.0
  port: 8080

credential-file:
  converter:
    base-url: ${TO_MARKDOWN_BASE_URL:http://127.0.0.1:8081}

  storage:
    # 没有配置环境变量则默认使用 LOCAL
    type: ${CREDENTIAL_FILE_STORAGE_TYPE:LOCAL}

    local:
      root: ${CREDENTIAL_FILE_LOCAL_ROOT:/Users/lujianshi/Desktop/projects/MinIO}

    minio:
      endpoint: ${MINIO_ENDPOINT:http://10.0.0.100:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:knowledge-file}

risk-analysis:
  # 当前按字符数近似控制汇总 Markdown 的上下文长度，默认约 128K 字符。
  max-merged-markdown-chars: ${RISK_ANALYSIS_MAX_MERGED_MARKDOWN_CHARS:131072}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://10.0.0.100:3306/bid-winning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}

    openai:
      base-url: http://127.0.0.1:8000/v1
      api-key: ${LM_STUDIO_QWEN3.6-27B}
      chat:
        model: "Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-MLX-oQ4-MTP"
      timeout: 120s


  mail:
    host: smtp.qq.com
    port: 587
    username: 1649681371@qq.com
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

chat-agent:
  python-base-url: ${CHAT_AGENT_PYTHON_BASE_URL:http://127.0.0.1:8082}
  user-id: ${CHAT_AGENT_USER_ID:1}
  datasource:
    url: ${CHAT_AGENT_MYSQL_URL:jdbc:mysql://10.0.0.100:3306/chat_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${CHAT_AGENT_MYSQL_USERNAME:${MYSQL_USERNAME}}
    password: ${CHAT_AGENT_MYSQL_PASSWORD:${MYSQL_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  file:
    name: logs/app.log
